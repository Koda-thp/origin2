name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Diagnostic des chemins Hostinger (aucun déploiement)"
        type: boolean
        default: false
  repository_dispatch:
    types: [sanity-deploy]

env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: vwdin2i0
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Inspect Hostinger paths
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:timeout 20; pwd; echo '--- home ---'; cls -la; echo '--- domains ---'; cd domains; cls -la; echo '--- domains/origin-lagree.fr ---'; cd origin-lagree.fr; cls -la; quit" -u "$FTP_USER,$FTP_PASSWORD" "sftp://$FTP_HOST:65002" || true
          probe="probe-${GITHUB_SHA}.txt"
          echo "$GITHUB_SHA" > "/tmp/$probe"
          for d in public_html domains/origin-lagree.fr/public_html domains/www.origin-lagree.fr/public_html; do
            lftp -e "set ftp:ssl-allow no; set ftp:passive-mode true; mkdir -p '$d'; cd '$d'; put /tmp/$probe; quit" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" && echo "sonde uploadée dans $d"
            echo -n "HTTP https://origin-lagree.fr/$probe depuis $d -> "
            curl -s -o /dev/null -w "%{http_code}\n" "https://origin-lagree.fr/$probe?cb=$RANDOM"
          done

  build-and-deploy:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.diagnose != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Add deploy marker
        run: echo "$GITHUB_SHA" > out/deploy-version.txt

      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.HOSTINGER_REMOTE_DIR || 'domains/origin-lagree.fr/public_html/' }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          ftp_deploy() {
            lftp -e "set ftp:ssl-allow no; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 3; mirror -R --verbose ./out/ $REMOTE_DIR; quit" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST"
          }
          sftp_deploy() {
            lftp -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 3; mirror -R --verbose ./out/ $REMOTE_DIR; quit" -u "$FTP_USER,$FTP_PASSWORD" "sftp://$FTP_HOST:65002"
          }
          ftp_deploy || { echo "FTP port 21 indisponible, tentative SFTP port 65002"; sftp_deploy; }

      - name: Verify live deployment
        run: |
          echo "Version attendue: $GITHUB_SHA"
          for i in 1 2 3 4 5 6 7 8 9; do
            live=$(curl -fsS --max-time 20 "https://origin-lagree.fr/deploy-version.txt?cb=$RANDOM" || true)
            echo "Tentative $i: $live"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Déploiement vérifié: le site sert le build $GITHUB_SHA."
              exit 0
            fi
            sleep 10
          done
          echo "ÉCHEC: le nouveau build n'est pas servi par le site (hôte ou chemin FTP incorrect)." >&2
          exit 1
