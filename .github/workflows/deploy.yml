name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-deploy]

env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: vwdin2i0
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Hostinger via LFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set ftp:ssl-allow no; set ftp:passive-mode true; set net:timeout 15; set net:max-retries 3; mirror -R --verbose ./out/ public_html/; quit" -u "${{ secrets.FTP_USERNAME }},$FTP_PASSWORD" 153.92.10.190
