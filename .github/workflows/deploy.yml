name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-deploy]

env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: vwdin2i0
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          ftp_deploy() {
            lftp -e "set ftp:ssl-allow no; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 3; mirror -R --verbose ./out/ public_html/; quit" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST"
          }
          sftp_deploy() {
            lftp -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 3; mirror -R --verbose ./out/ public_html/; quit" -u "$FTP_USER,$FTP_PASSWORD" "sftp://$FTP_HOST:65002"
          }
          ftp_deploy || { echo "FTP port 21 indisponible, tentative SFTP port 65002"; sftp_deploy; }

      - name: Verify live deployment
        run: |
          chunk=$(grep -oE '/_next/static/chunks/[A-Za-z0-9._-]+\.js' out/index.html | head -1)
          echo "Vérification du chunk déployé: https://origin-lagree.fr$chunk"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "https://origin-lagree.fr$chunk?cb=$RANDOM" -o /dev/null; then
              echo "Déploiement vérifié: le site sert le nouveau build."
              exit 0
            fi
            sleep 10
          done
          echo "ÉCHEC: le nouveau build n'est pas servi par le site (hôte ou chemin FTP incorrect)." >&2
          exit 1
